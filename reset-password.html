<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MATOSHREE Admin - Set Password</title>
<style>
:root{--ink:#2b1718;--muted:#806b62;--gold:#c99b50;--paper:#fbf5eb;--white:#fffdf9;--line:#eadcc8}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,"Noto Sans Devanagari",sans-serif}header{background:#351b25;color:white;padding:18px 22px;font-weight:700}main{max-width:460px;margin:8vh auto;padding:16px}.card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 8px 28px #3c21100b}h1{font-size:23px;margin:0 0 8px}p{color:var(--muted);font-size:14px;line-height:1.55}label{display:block;margin:15px 0 6px;font-size:13px;color:var(--muted)}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit}button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:10px;background:var(--gold);color:#281715;font:inherit;font-weight:700;cursor:pointer}.notice{padding:12px;border-radius:10px;background:#f5ead8;margin:14px 0;font-size:14px}.error{background:#f9e6e4;color:#8c252b}.success{background:#e2f2e7;color:#1d6840}.hidden{display:none!important}
</style>
</head>
<body>
<header>MATOSHREE TOURS &amp; TRAVELS — ADMIN</header>
<main><section class="card">
<h1>नवीन Admin Password सेट करा</h1>
<p>Gmail मधील नवीनतम Password Reset Email मधूनच येथे आले पाहिजे. लिंक वैध असल्यास नवीन Password सेट करा.</p>
<div id="message" class="notice">Reset लिंक तपासत आहे...</div>
<form id="resetForm" class="hidden">
<label for="password">नवीन Password</label><input id="password" type="password" minlength="8" autocomplete="new-password" required placeholder="किमान 8 अक्षरे">
<label for="confirmPassword">Password पुन्हा टाका</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required placeholder="तोच Password पुन्हा टाका">
<button id="saveBtn" type="submit">Password Save करा</button>
</form>
<p id="loginLink" class="hidden"><a href="./admin.html">Admin Login पेज उघडा</a></p>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(async function(){
 const SUPABASE_URL='https://ywbgpyrevwdiymymtlxy.supabase.co';
 const SUPABASE_KEY='sb_publishable_i5e8pBYCYMEbHGTpL8gRXA_mSv-dCBR';
 const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
 const message=document.getElementById('message');
 const form=document.getElementById('resetForm');
 const loginLink=document.getElementById('loginLink');
 function show(text,kind){message.textContent=text;message.className='notice '+(kind||'');}
 try{
   const params=new URLSearchParams(window.location.search);
   const tokenHash=params.get('token_hash');
   const type=params.get('type');
   if(tokenHash && type==='recovery'){
     const {error}=await db.auth.verifyOtp({token_hash:tokenHash,type:'recovery'});
     if(error) throw error;
   }
   const {data:{session},error:sessionError}=await db.auth.getSession();
   if(sessionError) throw sessionError;
   if(!session){show('ही Reset लिंक वैध नाही किंवा Expired झाली आहे. कृपया Supabase मधून नवीन Password Reset Email मागवा.','error');return;}
   show('Reset लिंक वैध आहे. आता नवीन Password सेट करा.','success');
   form.classList.remove('hidden');
 }catch(e){show('Reset लिंक तपासता आली नाही: '+(e.message||'Unknown error')+'. नवीन Reset Email आवश्यक असू शकतो.','error');}
 form.addEventListener('submit',async function(e){
   e.preventDefault();
   const password=document.getElementById('password').value;
   const confirm=document.getElementById('confirmPassword').value;
   if(password.length<8){show('Password किमान 8 अक्षरांचा असावा.','error');return;}
   if(password!==confirm){show('दोन्ही Password सारखे नाहीत. पुन्हा तपासा.','error');return;}
   const btn=document.getElementById('saveBtn');btn.disabled=true;btn.textContent='Saving...';
   const {error}=await db.auth.updateUser({password});
   btn.disabled=false;btn.textContent='Password Save करा';
   if(error){show('Password Save झाला नाही: '+error.message,'error');return;}
   show('Admin Password यशस्वीरीत्या सेट झाला. आता Admin Login करू शकता.','success');
   form.classList.add('hidden');loginLink.classList.remove('hidden');
   await db.auth.signOut();
 });
})();
</script>
</body></html>
